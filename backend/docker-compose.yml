version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mhealth-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: mhealth
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mhealth-network

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mhealth-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:5672:5672"   # AMQP port
      - "127.0.0.1:15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mhealth-network

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: mhealth-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"  # API port
      - "127.0.0.1:9001:9001"  # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mhealth-network

  # Backend API (FastAPI Application)
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mhealth-backend-api
    env_file:
      - .env
    environment:
      - SERVICE_TYPE=api
      - POSTGRES_DB_URL=${POSTGRES_DB_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - ML_SERVICE_URL=${ML_SERVICE_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    depends_on:
      - postgres
      - rabbitmq
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - mhealth-network
    restart: unless-stopped

  # Backend Celery Worker (Async Task Processing)
  backend-celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mhealth-backend-celery
    env_file:
      - .env
    environment:
      - SERVICE_TYPE=celery_worker
      - POSTGRES_DB_URL=${POSTGRES_DB_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - ML_SERVICE_URL=${ML_SERVICE_URL}
    volumes:
      - ./app:/app/app
    depends_on:
      - postgres
      - rabbitmq
      - minio
      - backend-api
    networks:
      - mhealth-network
    restart: unless-stopped

  # ML Service (Sentiment & Emotion Analysis)
  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    container_name: mhealth-ml-service
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ../ml-service/model_store:/app/model_store
    environment:
      - ML_SERVICE_HOST=0.0.0.0
      - ML_SERVICE_PORT=8001
      - SENTIMENT_MODEL_PATH=/app/model_store/best_model_state_legacy.pth
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - mhealth-network
    restart: unless-stopped

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ../frontend2
      dockerfile: Dockerfile
    container_name: mhealth-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://10.0.62.206:8000
    depends_on:
      - backend-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://10.0.62.206/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mhealth-network
    restart: unless-stopped

  # pgAdmin (Optional - PostgreSQL Web UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mhealth-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - mhealth-network

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  mhealth-network:
    driver: bridge
