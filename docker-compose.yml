version: '3.8'

# Root docker-compose.yml
#
# Usage:
#   cp backend/.env.example backend/.env
#   docker compose up -d

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mhealth-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: mhealthDB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mhealth-network

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mhealth-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-mhealth}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-admin123}
    ports:
      - "127.0.0.1:5672:5672"   # AMQP port
      - "127.0.0.1:15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mhealth-network

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: mhealth-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-mhealth}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
    ports:
      - "127.0.0.1:9000:9000"  # API port
      - "127.0.0.1:9001:9001"  # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mhealth-network

  # Backend API (FastAPI Application)
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mhealth-backend-api
    env_file:
      - backend/.env
    environment:
      - SERVICE_TYPE=api
      - FORWARDED_ALLOW_IPS=*
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      - postgres
      - rabbitmq
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - mhealth-network
    restart: unless-stopped

  # Backend Celery Worker (Async Task Processing)
  backend-celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mhealth-backend-celery
    env_file:
      - backend/.env
    environment:
      - SERVICE_TYPE=celery_worker
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - postgres
      - rabbitmq
      - minio
      - backend-api
    networks:
      - mhealth-network
    restart: unless-stopped

  # Backend Celery Beat (Periodic Task Scheduler)
  backend-celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mhealth-backend-celery-beat
    env_file:
      - backend/.env
    environment:
      - SERVICE_TYPE=celery_beat
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - postgres
      - rabbitmq
      - backend-api
    networks:
      - mhealth-network
    restart: unless-stopped

  # ML Service (Depression Risk Prediction)
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: mhealth-ml-service
    env_file:
      - ml-service/.env
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./ml-service/model_store:/app/model_store
    environment:
      - ML_SERVICE_HOST=0.0.0.0
      - ML_SERVICE_PORT=8001
      - DEPRESSION_MODEL_PATH=/app/model_store/random_forest_model.pkl
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - mhealth-network
    restart: unless-stopped

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend2
      dockerfile: Dockerfile
    container_name: mhealth-frontend
    ports:
      - "443:443"    # HTTPS only
    environment:
      # API URL is dynamically determined by client-side code
      # This allows access via both IP and domain name
      - NODE_ENV=production
    volumes:
      # Mount SSL certificates from host
      - ./backend/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend-api
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mhealth-network
    restart: unless-stopped

  # pgAdmin (Optional - PostgreSQL Web UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mhealth-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - mhealth-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  mhealth-network:
    driver: bridge
