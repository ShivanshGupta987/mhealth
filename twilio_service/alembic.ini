# alembic.ini — twilio_service (standalone, own PostgreSQL database)

[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is overridden at runtime from POSTGRES_DB_URL env var
# (see alembic/env.py). This placeholder prevents alembic from erroring
# when the env var is not yet set during local edits.
sqlalchemy.url = postgresql://twilio_user:twilio_pass@localhost:5433/mhealthDB


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
